    chase: {
      name: 'Chase pulse', bpm: 132, len: 32, drumLen: 16,
      lead: [12,15,19,24,19,15,12,15, 12,15,19,24,27,24,19,15], leadBase: 57, leadType: 'square', leadVol: 0.03, leadLen: 1.1,
      bass: [].concat(offbeat(0), offbeat(-4)), bassBase: 45, bassLen: 0.22, bassVol: 0.12,
      pad: [[12,19,24],[8,15,20]], padBase: 45, padVol: 0.018,
      kick: [0,4,8,12], kickVol: 0.14, snare: [4,12], hat: [2,6,10,14], hatVol: 0.035
    }
  };
  function scheduleInst(inst, horizon){
    const v = tracks[inst.key], spb = 60 / v.bpm / 4, dest = inst.g;
    while (inst.next < horizon && inst.next < inst.stopAt){
      const s = inst.step % v.len, at = inst.next;
      const ds = s % (v.drumLen || v.len);
      const leadArr = v.leadAlt && (inst.loops % 4 === 3) ? v.leadAlt : v.lead;
      const ln = leadArr[s % leadArr.length];
      if (ln !== N && ln !== undefined) tone({ at, f: mtof(v.leadBase + ln), type: v.leadType, d: spb * (v.leadLen || 1.6), v: v.leadVol, dest, attack: 0.01 });
      const bn = v.bass[s % v.bass.length];
      if (bn !== N && bn !== undefined) tone({ at, f: mtof(v.bassBase + bn), type: 'triangle', d: spb * 8 * v.bassLen, v: v.bassVol, dest, attack: 0.01 });
      if (v.pad && (s % 16) === 0){
        const chord = v.pad[Math.floor(s / 16) % v.pad.length];
        for (const c of chord) tone({ at, f: mtof(v.padBase + c), type: 'sawtooth', d: spb * 16 * 0.98, v: v.padVol || 0.02, dest, attack: 0.15 });
      }
      if (v.kick && v.kick.indexOf(ds) > -1) tone({ at, f: 110, f2: 45, type: 'sine', d: 0.12, v: v.kickVol, dest });
      if (v.snare && v.snare.indexOf(ds) > -1) noise({ at, d: 0.09, f: 1800, q: 1, v: 0.05, dest });
      if (v.fill && v.fill.indexOf(s) > -1) noise({ at, d: 0.07, f: 2000, q: 1, v: 0.06, dest });
      if (v.hat && v.hat.indexOf(ds) > -1) noise({ at, d: 0.03, type: 'highpass', f: 6000, v: v.hatVol, dest });
      inst.next += spb;
      inst.step = (inst.step + 1) % v.len;
      if (inst.step === 0) inst.loops++;
    }
  }
  function tick(){
    if (!ctx) return;
    const horizon = ctx.currentTime + 0.2;
    for (const inst of insts) scheduleInst(inst, horizon);
    insts = insts.filter(i=>{
      if (i.stopAt < ctx.currentTime - 0.3){ try { i.g.disconnect(); } catch(e){} return false; }
      return true;
    });
    if (!insts.length){ clearInterval(timer); timer = null; }
  }
  function makeInst(key, at, step){
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, ctx.currentTime); g.connect(musicFilter);
    return {key, g, step: step||0, next: at, stopAt: Infinity, loops: 0};
  }
  const rootAt = (key, bar) => { const p = tracks[key].pad; return p[bar % p.length][0] % 12; };
  const bars = key => tracks[key].len / 16;

  /* Switch songs. Waits for the current bar to end, starts the new song on a bar whose chord
     matches (they share A as root and start Am → F), and crossfades over about one bar.
     Galloping march → Chase pulse waits for the march's drum fill when it is close. */
  function music(key){
    wanted = key;
    if (!key){ stopMusic(); return; }
    if (!settings().music || !ensure()) return;
    const cur = insts.find(i=>i.stopAt === Infinity);
    if (cur && cur.key === key) return;
    const now = ctx.currentTime;
    if (!cur){
      const at = now + 0.08, inst = makeInst(key, at, 0);
      inst.g.gain.setValueAtTime(0.0001, at); inst.g.gain.exponentialRampToValueAtTime(1, at + 0.8);
      insts.push(inst);
    } else {
      const v = tracks[cur.key], spb = 60 / v.bpm / 4;
      let stepsLeft = (16 - (cur.step % 16)) % 16;
      if (cur.key === 'march' && key === 'chase'){
        const toFillEnd = (v.len - cur.step) % v.len;
        if (toFillEnd * spb <= 4.2) stepsLeft = toFillEnd;
      }
      let boundary = cur.next + stepsLeft * spb, oldBar = Math.floor(((cur.step + stepsLeft) % v.len) / 16);
      let startBar = -1;
      for (let tries = 0; tries < bars(cur.key) && startBar < 0; tries++){
        const root = rootAt(cur.key, oldBar);
        for (let b = 0; b < bars(key); b++) if (rootAt(key, b) === root){ startBar = b; break; }
        if (startBar < 0){ boundary += 16 * spb; oldBar = (oldBar + 1) % bars(cur.key); }
      }
      if (startBar < 0) startBar = 0;
      const fade = 16 * spb;
      cur.g.gain.cancelScheduledValues(boundary);
      cur.g.gain.setValueAtTime(1, boundary);
      cur.g.gain.linearRampToValueAtTime(0.0001, boundary + fade);
      cur.stopAt = boundary + fade;
      insts.filter(i=>i !== cur && i.stopAt === Infinity).forEach(i=> i.stopAt = now);
      const inst = makeInst(key, boundary, startBar * 16);
      inst.g.gain.setValueAtTime(0.0001, boundary);
      inst.g.gain.linearRampToValueAtTime(1, boundary + 16 * 60 / tracks[key].bpm / 4);   // one bar of the new song
      insts.push(inst);
    }
    if (!timer){ timer = setInterval(tick, 30); }
    tick();
  }
  function stopMusic(fadeSec){
    wanted = null;
    if (!ctx) return;
    const now = ctx.currentTime, f = fadeSec == null ? 0.6 : fadeSec;
    for (const i of insts){
      if (i.stopAt !== Infinity && i.stopAt < now + f) continue;
      i.g.gain.cancelScheduledValues(now);
      i.g.gain.setValueAtTime(Math.max(0.0001, i.g.gain.value), now);
      i.g.gain.exponentialRampToValueAtTime(0.0001, now + f + 0.01);
      i.stopAt = now + f;
    }
  }
  /* Lower the music briefly so a big sound effect stands out */
  function duck(level, seconds){
    if (!ctx) return;
    const now = ctx.currentTime, g = duckBus.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(level, now + 0.08);
    g.setValueAtTime(level, now + seconds);
    g.linearRampToValueAtTime(1, now + seconds + 0.6);
  }
  function setMusicEnabled(){ applyVolumes(); if (settings().music && wanted && !insts.some(i=>i.stopAt===Infinity)){ const w = wanted; music(w); } }

  return {
    ensure, play, music, stopMusic, duck, applyVolumes, setMusicEnabled,
    recentlyPlayed: (ms=40) => performance.now() - lastPlay < ms,
    get current(){ const c = insts.find(i=>i.stopAt===Infinity); return c ? c.key : null; },
    tracks,
  };
})();

/* =====================================================================
   3c. SELF-TEST  (runs on load; results in the console, or open with #selftest)
   ===================================================================== */
function selfTest(){
  const res = [];
  const ok = (name, cond, detail) => res.push({name, pass: !!cond, detail});
  const mk = (s, name, cost, users, paidBy=null) => { const it = makeItem(s, name, toCents(parseExpr(cost)), ''); it.usedBy = new Set(users); it.paidBy = paidBy; s.items.push(it); };

  // Scenario from the brief: Alex, Sam, Jo. Alex paid in full, Flour paid by Sam.
  const s = blankState(); s.count = 3; s.names = ['Alex','Sam','Jo','','','']; s.paidInFullBy = 0;
  mk(s,'Cadbury','5.99',[0,1]); mk(s,'Mrs Rogers','2.29',[1]); mk(s,'Black Beans','0.99',[0,1,2]);
  mk(s,'Corn','1.15',[2]); mk(s,'Flour','1.89',[0],1); mk(s,'Diced Tomatoes','3.45',[0,2]); mk(s,'Tuna','2.39',[1]);
  const r = compute(s);
  ok('Paid Alex 16.26', r.paid[0]===1626, r.paid[0]);
  ok('Paid Sam 1.89', r.paid[1]===189, r.paid[1]);
  ok('Paid Jo 0', r.paid[2]===0, r.paid[2]);
  ok('Owes Alex 6.94', r.owes[0]===694, r.owes[0]);
  ok('Owes Sam 8.005 → 8.00 or 8.01', r.owes[1]===800 || r.owes[1]===801, r.owes[1]);
  ok('Owes Jo 3.205 → 3.20 or 3.21', r.owes[2]===320 || r.owes[2]===321, r.owes[2]);
  ok('Owes add up to the bill (18.15)', r.owes.reduce((a,b)=>a+b)===1815);
  ok('Net Alex +9.32', r.net[0]===932, r.net[0]);
  ok('Nets add up to zero', r.net.reduce((a,b)=>a+b)===0);
  const sam = r.payments.find(p=>p.from===1&&p.to===0), jo = r.payments.find(p=>p.from===2&&p.to===0);
  ok('Sam pays Alex 6.11–6.12', sam && (sam.cents===611||sam.cents===612), sam&&sam.cents);
  ok('Jo pays Alex 3.20–3.21', jo && (jo.cents===320||jo.cents===321), jo&&jo.cents);
  ok('Payments sum to exactly 9.32', r.payments.reduce((a,p)=>a+p.cents,0)===932);
  ok('Only two payments', r.payments.length===2, r.payments.length);

  // Same scenario entered as two bills (Alex's bill and Sam's bill) gives the same answer
  const b = blankState(); b.count = 3; b.payMode = 'bills';
  mk(b,'Cadbury','5.99',[0,1],0); mk(b,'Mrs Rogers','2.29',[1],0); mk(b,'Black Beans','0.99',[0,1,2],0);
  mk(b,'Corn','1.15',[2],0); mk(b,'Flour','1.89',[0],1); mk(b,'Diced Tomatoes','3.45',[0,2],0); mk(b,'Tuna','2.39',[1],0);
  const rb = compute(b);
  ok('Several bills: same nets as one payer + override', rb.net.join()===r.net.join(), rb.net);
  const b2 = blankState(); b2.count = 2; b2.payMode = 'bills'; b2.paidInFullBy = 0; mk(b2,'X','10',[0,1]);
  ok('Several bills: item with no bill payer counts as "no payer"', compute(b2).noPayer===1000);

  // The spreadsheet's own saved data (Harri paid everything; 7 items shared by all three)
  const h = blankState(); h.count = 3; h.names = ['Harri','Micah','Beth','','','']; h.paidInFullBy = 0;
  const allThree = new Set([1,2,3,7,13,15,19]);
  TEST_RECEIPT.forEach(([n,c],i)=> mk(h, n, c, allThree.has(i)?[0,1,2]:[0]));
  const rh = compute(h);
  ok('Sheet data: total 120.98', rh.total===12098, rh.total);
  ok('Sheet data: Micah pays Harri 12.80', rh.payments.some(p=>p.from===1&&p.to===0&&p.cents===1280));
  ok('Sheet data: Beth pays Harri 12.80', rh.payments.some(p=>p.from===2&&p.to===0&&p.cents===1280));
  ok('Sheet data: Harri net equals what he receives', rh.net[0]===rh.payments.reduce((a,p)=>a+p.cents,0), rh.net[0]);

  // Tax/tip spreads proportionally and still balances
  const tx = blankState(); tx.count = 3; tx.paidInFullBy = 2; tx.taxTipPercent = 12.5;
  mk(tx,'A','10',[0,1,2]); mk(tx,'B','7.01',[0,1]); mk(tx,'C','0.99',[1]);
  const rt = compute(tx);
  ok('Tax 12.5%: nets add up to zero', rt.net.reduce((a,b)=>a+b)===0, rt.net);
  ok('Tax 12.5%: owes add up to 20.25', rt.owes.reduce((a,b)=>a+b)===2025, rt.owes);

  // Parser
  [['3*1.15',345],['2*3.29',658],['3 x $1.15',345],['(1+2)*3',900],['10/4',250],['-2.5',-250],['$1,234.50',123450],['.5',50]]
    .forEach(([e,c])=> ok(`parse "${e}" = ${c}¢`, toCents(parseExpr(e))===c, toCents(parseExpr(e))));
  ['abc','1+','2**3','1/0','','alert(1)','(1'].forEach(e=> ok(`parse rejects "${e}"`, parseExpr(e)===null));

  // Receipt paste
  const rc = parseReceipt(['COUNTDOWN METRO','123 Queen St Auckland','Cadbury Dairy Milk 315g 5.99','PAMS DICED TOMATOES 400G 3.45','3 @ $1.15',
    'BANANAS','0.753 kg @ $3.49/kg 2.63','BEEF MINCE 340G','2 @ $8.99 17.98','Bacon 7.98','Discount -1.00','SUBTOTAL 36.03','TOTAL 36.03','EFTPOS 36.03'].join('\n'));
  ok('Receipt: 5 items found', rc.length===5, rc.map(x=>x.name));
  ok('Receipt: header lines ignored', rc[0] && rc[0].name==='Cadbury Dairy Milk 315g' && !rc[0].flags.length, rc[0]);
  ok('Receipt: capitals tidied, qty line joined', rc[1] && rc[1].name==='Pams Diced Tomatoes 400g (3 x $1.15)' && rc[1].cents===345, rc[1]);
  ok('Receipt: weighed item on two lines', rc[2] && /^Bananas/.test(rc[2].name) && rc[2].cents===263 && !rc[2].flags.length, rc[2]);
  ok('Receipt: 2 @ price with total', rc[3] && rc[3].cents===1798, rc[3]);
  ok('Receipt: discount taken off and flagged', rc[4] && rc[4].cents===698 && rc[4].flags.length===1, rc[4]);
  ok('Receipt: stops at TOTAL', !rc.some(x=>/eftpos|total/i.test(x.name)));
  const rc2 = parseReceipt('Special K Cereal 5.99\nService charge 10% 4.20\nLONG ITEM NAME THAT\nWRAPS 2.50\nMilk');
  ok('Receipt: "Special" is not a discount', rc2[0] && rc2[0].cents===599 && !rc2[0].flags.length, rc2[0]);
  ok('Receipt: service charge flagged', rc2[1] && rc2[1].flags.length>0, rc2[1]);
  ok('Receipt: orphan line flagged, not silently joined', rc2[2] && rc2[2].name==='Wraps' && rc2[2].flags.length>0, rc2[2]);
  ok('Receipt: name with no price is flagged', rc2[3] && rc2[3].cents===null && rc2[3].flags.length>0, rc2[3]);

  // Boss
  ok('Boss HP scales with price', bossHP(1798) > bossHP(299), [bossHP(299), bossHP(1798)]);
  ok('Boss HP stays between 8 and 36', bossHP(1)===8 && bossHP(999999)===36);
  ok('Cheap boss is a mini-boss', isMiniBoss(599) && !isMiniBoss(1798));

  // Emoji on the real receipt
  const want = ['🍫','🧂','🫘','🌽','🌾','🍅','🐟','🌯','🥥','🌴','🥑','🍌','🍄','🍅','🥓','🥛','🧀','🥛','🍝','🥩','🍗','🍗'];
  TEST_RECEIPT.forEach(([n],i)=> ok(`emoji ${want[i]} ${n}`, emojiFor(n)===want[i], emojiFor(n)));
  ok('emoji fallback is a box 📦', emojiFor('Mystery thing')==='📦');
  ok(`emoji dictionary has 150+ keywords (${EMOJI_RULES.length})`, EMOJI_RULES.length>=150);

  const failed = res.filter(x=>!x.pass);
  if (typeof console !== 'undefined'){
    if (failed.length){ console.error(`Bill Splitter self-test: ${failed.length} of ${res.length} checks failed`); console.table(failed); }
    else console.info(`Bill Splitter self-test: all ${res.length} checks passed`);
  }
  return {res, failed};
}

/* =====================================================================
   5. UI
   ===================================================================== */
let state = load() || blankState();
const $ = sel => document.querySelector(sel);
const screenEl = $('#screen');
const rmQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
function motionReduced(){ const m = state.settings.motion; return m === 'on' || (m === 'auto' && rmQuery.matches); }
function applyMotion(){ document.body.classList.toggle('rm', motionReduced()); }
if (rmQuery.addEventListener) rmQuery.addEventListener('change', applyMotion);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people = () => Array.from({length:state.count}, (_,i)=>({i, name: personName(state,i), color: PERSON_COLORS[i]}));
const itemById = id => state.items.find(it=>it.id===id);
function persist(){ save(); }

function go(screen){
  state.screen = screen; persist(); render();
  window.scrollTo(0,0);
}
function render(){
  const sc = state.screen;
  $('#app').classList.toggle('wide', sc === 'review');
  document.querySelectorAll('.steps button').forEach(b=>{
    if (b.dataset.go === sc) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
  });
  if (sc === 'setup') renderSetup();
  else if (sc === 'items') renderItems();
  else renderReview();
  if (location.hash === '#selftest') showSelfTest();
}
document.querySelector('.steps').addEventListener('click', e=>{
  const b = e.target.closest('[data-go]'); if (b && !b.disabled) go(b.dataset.go);
});

/* ---------- sound hooks: paper tap on taps, tick on typing ---------- */
document.addEventListener('pointerdown', ()=> Sound.ensure(), {capture:true, passive:true});
document.addEventListener('keydown', ()=> Sound.ensure(), {capture:true});
document.addEventListener('click', e=>{
  const b = e.target.closest('button, select, .chip, input[type=checkbox]');
  if (!b || b.disabled || b.closest('[data-nosnd]')) return;
  if (Sound.recentlyPlayed(60)) return;          // a more specific sound already played for this tap
  Sound.play('tapPaper');
});
let lastTick = 0;
document.addEventListener('input', e=>{
  const t = e.target;
  if (!t.matches('input:not([type=range]):not([type=checkbox]), textarea') || e.inputType === 'insertFromPaste') return;
  const n = performance.now(); if (n - lastTick > 35){ lastTick = n; Sound.play('tick'); }
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actionLabel, action){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
  t.hidden = false;
  if (actionLabel) t.querySelector('button').onclick = ()=>{ t.hidden = true; action(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.hidden = true, 4500);
}

/* ---------- sheets ---------- */
let sheetTimer;
function openSheet(html, onClick){
  const sheet = $('#sheet'), wasOpen = !sheet.hidden;
  sheet.innerHTML = html; sheet.hidden = false;
  $('#toast').hidden = true;
  if (!wasOpen){ sheet.classList.remove('shown'); clearTimeout(sheetTimer); sheetTimer = setTimeout(()=> sheet.classList.add('shown'), 320); }
  sheet.onclick = e=>{ if (e.target === sheet){ closeSheet(); return; } if (onClick) onClick(e); };
  return sheet;
}
function closeSheet(){ const s = $('#sheet'); clearTimeout(sheetTimer); s.classList.remove('shown'); if (!s.hidden){ s.hidden = true; s.innerHTML = ''; s.onclick = null; } }
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && !$('#sheet').hidden){ e.stopPropagation(); closeSheet(); } }, true);

/* ---------- settings (sound, music, motion) ---------- */
function openSettings(){
  const st = state.settings;
  const sw = (k, on) => `<button type="button" class="switch" role="switch" aria-checked="${on}" data-sw="${k}"></button>`;
  const html = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setT">
    <h2 id="setT">Settings</h2>
    <p>Sound never carries information on its own, so everything works with it off.</p>
    <div class="set-row"><div><b>Sound effects</b><small>Taps, typing, pen marks, cards</small></div>${sw('sfx', st.sfx)}</div>
    <div class="set-vol" ${st.sfx?'':'hidden'}><input type="range" min="0" max="1" step="0.05" value="${st.sfxVol}" data-vol="sfxVol" aria-label="Effects volume"></div>
    <div class="set-row"><div><b>Music</b><small>Plays in Game Mode only</small></div>${sw('music', st.music)}</div>
    <div class="set-vol" ${st.music?'':'hidden'}><input type="range" min="0" max="1" step="0.05" value="${st.musicVol}" data-vol="musicVol" aria-label="Music volume"></div>
    <div class="set-row"><div><b>Boss every game</b><small>Game Mode always has a boss battle (3+ cards). Off: a 1 in 2 chance.</small></div>${sw('bossAlways', st.bossAlways)}</div>
    <div class="set-row" style="display:block"><div style="margin-bottom:8px"><b>Reduce motion</b><small>Simpler animations, no shaking. Auto follows your phone.</small></div>
      <div class="seg seg3">${['auto','on','off'].map(m=>`<button type="button" data-motion="${m}" aria-pressed="${st.motion===m}">${m==='auto'?'Auto':m==='on'?'On':'Off'}</button>`).join('')}</div></div>
    <p class="note" style="margin-top:12px">On iPhone, the silent switch may mute sound in the browser.</p>
    <div style="margin-top:14px"><button type="button" class="btn primary big" data-close>Done</button></div>
  </div>`;
  const sheet = openSheet(html, e=>{
    const s = e.target.closest('[data-sw]');
    if (s){
      const k = s.dataset.sw; st[k] = !st[k]; s.setAttribute('aria-checked', st[k]);
      const vol = s.closest('.set-row').nextElementSibling; if (vol && vol.classList.contains('set-vol')) vol.hidden = !st[k];
      persist(); Sound.applyVolumes(); if (k === 'music') Sound.setMusicEnabled();
      if (k === 'sfx' && st.sfx) Sound.play('tapPaper');
      return;
    }
    const m = e.target.closest('[data-motion]');
    if (m){ st.motion = m.dataset.motion; sheet.querySelectorAll('[data-motion]').forEach(x=>x.setAttribute('aria-pressed', x===m)); persist(); applyMotion(); return; }
    if (e.target.closest('[data-close]')) closeSheet();
  });
  sheet.querySelectorAll('[data-vol]').forEach(r=>{
    r.addEventListener('input', ()=>{ st[r.dataset.vol] = +r.value; Sound.applyVolumes(); persist(); });
    r.addEventListener('change', ()=>{ if (r.dataset.vol === 'sfxVol') Sound.play('assign'); });
  });
}
$('#setBtn').onclick = openSettings;

function payerOptions(selected, forRow){
  const opts = people().map(p=>`<option value="${p.i}"${selected===p.i ? ' selected':''}>${esc(p.name)}</option>`).join('');
  if (!forRow) return `<option value=""${selected==null?' selected':''}>Choose…</option>` + opts;
  if (state.payMode === 'bills') return (selected==null ? `<option value="d" selected>Nobody yet</option>` : '') + opts;
  const def = state.paidInFullBy!=null && state.paidInFullBy<state.count ? esc(personName(state,state.paidInFullBy)) : 'Nobody yet';
  return `<option value="d"${selected==null?' selected':''}>${def}</option><optgroup label="Paid by someone else">${opts}</optgroup>`;
}
function setPayMode(mode){
  if (mode === state.payMode) return;
  if (mode === 'bills'){
    for (const it of state.items) if (it.paidBy == null && state.paidInFullBy != null) it.paidBy = state.paidInFullBy;
    if (state.billPayer == null) state.billPayer = state.paidInFullBy != null ? state.paidInFullBy : 0;
  } else {
    const tally = Array(state.count).fill(0);
    for (const it of state.items) if (it.paidBy != null) tally[it.paidBy] += it.costCents;
    const top = tally.indexOf(Math.max(...tally));
    if (state.paidInFullBy == null) state.paidInFullBy = tally[top] > 0 ? top : null;
    for (const it of state.items) if (it.paidBy === state.paidInFullBy) it.paidBy = null;
  }
  state.payMode = mode; persist();
}
function payModeSeg(){
  return `<div class="seg" role="group" aria-label="Who paid">
    <button type="button" data-pm="one" aria-pressed="${state.payMode==='one'}">One person paid</button>
    <button type="button" data-pm="bills" aria-pressed="${state.payMode==='bills'}">Several bills</button></div>`;
}

/* ---------- Screen 1: setup ---------- */
function renderSetup(){
  const P = people();
  screenEl.innerHTML = `
  <section class="panel">

  screenEl.querySelector('[data-act="dec"]').onclick = ()=> setCount(state.count-1);
  screenEl.querySelector('[data-act="inc"]').onclick = ()=> setCount(state.count+1);
  const ps = $('#payerSel'); if (ps) ps.onchange = e=>{ state.paidInFullBy = e.target.value==='' ? null : +e.target.value; persist(); };
  $('#taxIn').onchange = e=>{ const v = parseExpr(e.target.value); state.taxTipPercent = v==null ? 0 : v; e.target.value = state.taxTipPercent; persist(); };
  screenEl.querySelector('[data-go-next]').onclick = ()=> go('items');
}
function setCount(n){
  n = clamp(n, MIN_PEOPLE, MAX_PEOPLE);
  if (n < state.count){
    for (const it of state.items){
      it.usedBy = new Set([...it.usedBy].filter(p=>p<n));
      if (it.paidBy != null && it.paidBy >= n) it.paidBy = null;
    }
    if (state.paidInFullBy != null && state.paidInFullBy >= n) state.paidInFullBy = null;
    if (state.billPayer != null && state.billPayer >= n) state.billPayer = 0;
  }
  const grew = n > state.count;
  state.count = n; persist(); render();
  if (grew){ const last = $(`#nm${n-1}`); if (last) last.focus({preventScroll:true}); }
}

/* ---------- Screen 2: items ---------- */
let editingId = null;
function renderItems(){
  const bills = state.payMode === 'bills';
  if (bills && (state.billPayer == null || state.billPayer >= state.count)) state.billPayer = 0;
  screenEl.innerHTML = `
  <section class="panel entry">
    <div class="paste-row"><span class="note">Type items below, or paste a receipt.</span><button type="button" class="btn ghost" id="pasteBtn" style="padding:9px 14px;font-size:15px">📋 Paste receipt</button></div>
    ${bills ? `<div class="bill-pick"><span>This bill was paid by</span><div class="chips small" id="billChips">
      ${people().map(p=>`<button type="button" class="chip" style="--pc:${p.color}" data-bill="${p.i}" aria-pressed="${state.billPayer===p.i}">${esc(p.name)}</button>`).join('')}

    <div class="cost-row">

    </div>

  <section class="panel">

    <ol class="items" id="itemList"></ol>
    <div id="totalLine"></div>
    <div class="row between" style="margin-top:8px">
      <button type="button" class="link" id="demoBtn">Load the demo receipt</button>
      <button type="button" class="link" id="clearBtn">Clear items</button>
    </div>
  </section>
  <div class="dock"><div>
    <button class="btn primary big" id="divideBtn">Divide</button>
    <button class="btn game-btn" id="gameBtn">▶ Game Mode <small>assign items as a card game</small></button>
  </div></div>`;

  const nameIn = $('#itemName'), costIn = $('#itemCost'), prev = $('#costPreview');
  const updatePreview = ()=>{
    const v = costIn.value.trim();
    if (!v){ prev.textContent = ''; prev.className=''; return; }
    const c = toCents(parseExpr(v));
    if (c == null){ prev.textContent = '?'; prev.className = 'bad'; }
    else { prev.textContent = (/[^\d.$\s]/.test(v) ? '= ' : '') + fmt(c); prev.className = ''; }
  };
  costIn.addEventListener('input', updatePreview);
  nameIn.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); costIn.focus(); } if (e.key==='Escape') cancelEdit(); });
  costIn.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); commitEntry(); } if (e.key==='Escape') cancelEdit(); });
  $('#addBtn').addEventListener('click', commitEntry);

    b.addEventListener('pointerdown', e=> e.preventDefault());
    b.addEventListener('click', ()=>{
      const op = b.dataset.op, s = costIn.selectionStart ?? costIn.value.length, en = costIn.selectionEnd ?? s;
      costIn.value = costIn.value.slice(0,s) + op + costIn.value.slice(en);
      costIn.focus(); costIn.setSelectionRange(s+1, s+1); updatePreview();
    });
  });
  screenEl.querySelectorAll('[data-bill]').forEach(b=> b.onclick = ()=>{
    state.billPayer = +b.dataset.bill; persist();
    screenEl.querySelectorAll('[data-bill]').forEach(x=> x.setAttribute('aria-pressed', x===b));
  });
  $('#pasteBtn').onclick = ()=> openPaste();
  $('#demoBtn').onclick = ()=>{

    if (state.payMode === 'bills') state.items.forEach(it=> it.paidBy = state.billPayer);

  };
  $('#divideBtn').onclick = ()=>{ Sound.play('divChime'); go('review'); };
  $('#gameBtn').onclick = ()=> startGame();
  $('#itemList').addEventListener('click', e=>{

function itemRow(it){
  const u = usersOf(it, state);
  return `<li class="item${it.id===editingId?' is-editing':''}" data-id="${it.id}">
    <span class="emo" aria-hidden="true">${emojiFor(it.name)}</span>
    <span class="nm">${esc(it.name)}${u.length?`<span class="dots" aria-label="shared by ${u.map(p=>esc(personName(state,p))).join(', ')}">${u.map(p=>`<i style="background:${PERSON_COLORS[p]}"></i>`).join('')}</span>`:''}</span>
    <span class="amt">${fmt(it.costCents)}</span>
    <button type="button" class="icon" data-edit aria-label="Edit ${esc(it.name)}">✎</button>
    <button type="button" class="icon" data-del aria-label="Delete ${esc(it.name)}">×</button>
  </li>`;
}
function renderItemList(){
  const list = $('#itemList'); if (!list) return;
  const total = state.items.reduce((a,it)=>a+it.costCents,0);
  if (!state.items.length) list.innerHTML = `<li class="empty"><strong>No items yet</strong>Type the first item from your receipt above, or paste one.</li>`;
  else if (state.payMode === 'bills'){
    const groups = new Map();
    for (const it of state.items){ const k = effectivePayer(it, state); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
    const keys = [...groups.keys()].sort((a,b)=> (a==null) - (b==null) || a - b);
    list.innerHTML = keys.map(k=>{
      const its = groups.get(k), sub = its.reduce((a,it)=>a+it.costCents,0);
      return `<li class="bill-head tex ${k==null?'nopayer':''}" style="--pc:${k==null?WARN_COLOR:PERSON_COLORS[k]}"><span>${k==null?'No payer yet':`Paid by ${esc(personName(state,k))}`}</span><span>${fmt(sub)}</span></li>` + its.map(itemRow).join('');

function commitEntry(){
  const nameIn = $('#itemName'), costIn = $('#itemCost');
  const name = nameIn.value.trim(), raw = costIn.value.trim();
  const cents = toCents(parseExpr(raw));
  if (!name){ nameIn.focus(); nudge(nameIn); return; }
  if (cents == null){ costIn.focus(); nudge(costIn); return; }
  const expr = /[^\d.$\s,]/.test(raw) ? raw : '';
  let it;
  if (editingId != null && (it = itemById(editingId))){ it.name = name; it.costCents = cents; it.expr = expr; editingId = null; $('#editBar').innerHTML=''; $('#addBtn').textContent='Add'; }
  else { it = makeItem(state, name, cents, expr); if (state.payMode === 'bills') it.paidBy = state.billPayer; state.items.push(it); }
  persist();
  nameIn.value = ''; costIn.value = ''; $('#costPreview').textContent = '';
  nameIn.focus({preventScroll:true});
  renderItemList();
  shake($('#app'), weightOf(it) * 0.6);
}
function startEdit(id){
  const it = itemById(id); if (!it) return;
  editingId = id;
  $('#itemName').value = it.name; $('#itemCost').value = it.expr || (it.costCents/100).toFixed(2);
  $('#itemCost').dispatchEvent(new Event('input'));
  $('#addBtn').textContent = 'Save';
  $('#editBar').innerHTML = `<div class="editing-bar"><span>Editing ${esc(emojiFor(it.name))} ${esc(it.name)}</span><button type="button" class="link" style="padding:4px 8px" id="cancelEdit">Cancel</button></div>`;
  $('#cancelEdit').onclick = cancelEdit;
  renderItemList();
  window.scrollTo({top:0, behavior: motionReduced() ? 'auto' : 'smooth'});
  $('#itemName').focus({preventScroll:true});
}
function cancelEdit(){
  if (editingId == null) return;
  editingId = null; $('#editBar').innerHTML=''; $('#addBtn').textContent='Add';
  $('#itemName').value=''; $('#itemCost').value=''; $('#costPreview').textContent='';
  renderItemList();
}
function deleteItem(id, after){
  const idx = state.items.findIndex(it=>it.id===id); if (idx<0) return;
  const [it] = state.items.splice(idx,1);
  if (editingId === id) cancelEdit();
  persist(); after();
  toast(`Deleted ${it.name}`, 'Undo', ()=>{ state.items.splice(idx,0,it); persist(); render(); });
}

/* ---------- Paste a receipt ---------- */
function isDemoItems(){
  return state.items.length === DEMO_RECEIPT.length && state.items.every((it,i)=> it.name === DEMO_RECEIPT[i][0]);
}
function openPaste(prefill){
  const canRead = !!(navigator.clipboard && navigator.clipboard.readText);
  const html = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pT">
    <h2 id="pT">Paste a receipt</h2>
    <p>On iPhone: open the receipt photo, touch and hold the text (or tap the Live Text button), choose <b>Select All</b>, then <b>Copy</b>. Paste it below.</p>
    <textarea class="in" id="pasteIn" placeholder="Paste the receipt text here" spellcheck="false" autocapitalize="off">${esc(prefill||'')}</textarea>
    <div class="row between" style="margin:10px 0 14px">
      ${canRead ? `<button type="button" class="btn ghost" id="pasteClip" style="padding:9px 14px;font-size:15px">Paste from clipboard</button>` : '<span></span>'}
      <span class="note" style="margin:0">Lines it isn't sure about are flagged.</span>
    </div>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="pasteGo">Sort into items</button></div>
  </div>`;
  const sheet = openSheet(html, e=>{ if (e.target.closest('[data-close]')) closeSheet(); });
  const ta = $('#pasteIn');
  setTimeout(()=> ta.focus(), 60);
  const clip = $('#pasteClip');
  if (clip) clip.onclick = async ()=>{
    try { const t = await navigator.clipboard.readText(); if (t){ ta.value = t; } else toast('The clipboard is empty'); }
    catch(e){ toast('Paste into the box instead (long-press → Paste)'); ta.focus(); }
  };
  $('#pasteGo').onclick = ()=>{
    const found = parseReceipt(ta.value);
    if (!found.length){ nudge(ta); toast('No items found. Check the text has prices on it.'); return; }
    showPastePreview(found, ta.value);
  };
}
function showPastePreview(found, rawText){
  const rows = found.map(f=>({...f, on:true, costText: f.cents==null ? '' : (f.cents/100).toFixed(2)}));
  const replaceDefault = isDemoItems();
  const draw = ()=>{
    const flagged = rows.filter(r=>r.on && r.flags.length).length;
    const valid = rows.every(r=> !r.on || (r.name.trim() && toCents(parseExpr(r.costText)) != null));
    const n = rows.filter(r=>r.on).length;
    const tot = rows.filter(r=>r.on).reduce((a,r)=> a + (toCents(parseExpr(r.costText))||0), 0);
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pvT">
      <h2 id="pvT">Check these items</h2>
      <div class="pv-sum"><span>${rows.length} found${flagged?` · <b>${flagged} need a look</b>`:''}</span><span>${fmt(tot)}</span></div>
      <ul class="pv">${rows.map((r,i)=>`<li class="${r.flags.length?'flag':''} ${r.on?'':'off'}" data-row="${i}">
        <input type="checkbox" data-on="${i}" ${r.on?'checked':''} aria-label="Include ${esc(r.name)}">
        <input class="in" data-nm="${i}" value="${esc(r.name)}" aria-label="Item name">
        <input class="in" data-ct="${i}" value="${esc(r.costText)}" inputmode="decimal" aria-label="Cost" placeholder="?" style="text-align:right">
        ${r.flags.length?`<div class="why">⚠ ${r.flags.map(esc).join(' · ')}</div>`:''}
      </li>`).join('')}</ul>
      ${state.items.length ? `<label class="check"><input type="checkbox" id="pvReplace" ${replaceDefault?'checked':''}> Replace the ${state.items.length} items already in the list${replaceDefault?' (the demo)':''}</label>` : ''}
      ${state.payMode==='bills' ? `<p class="note" style="margin:0 0 12px">These go on ${esc(personName(state,state.billPayer??0))}'s bill.</p>` : ''}
      <div class="sheet-actions"><button type="button" class="btn ghost" data-back>Back</button>
        <button type="button" class="btn primary" data-add ${valid && n ? '' : 'disabled'}>${valid ? `Add ${n} item${n===1?'':'s'}` : 'Fix or untick the red costs'}</button></div>
    </div>`;
  };
  let replace = replaceDefault;
  const sheet = openSheet(draw(), e=>{
    if (e.target.closest('[data-back]')){ openPaste(rawText); return; }
    if (e.target.closest('[data-add]')){
      if (replace){ state.items = []; editingId = null; }
      for (const r of rows) if (r.on){
        const cents = toCents(parseExpr(r.costText));
        const it = makeItem(state, r.name.trim(), cents, r.expr || '');
        if (state.payMode === 'bills') it.paidBy = state.billPayer;
        state.items.push(it);
      }
      persist(); closeSheet(); renderItems();
      toast(`Added ${rows.filter(r=>r.on).length} items`);
    }
  });
  const redraw = (focusSel)=>{ const pos = sheet.querySelector('.pv')?.scrollTop||0; sheet.innerHTML = draw(); const pv = sheet.querySelector('.pv'); if (pv) pv.scrollTop = pos; bind(); if (focusSel){ const f = sheet.querySelector(focusSel); if (f) f.focus(); } };
  const bind = ()=>{
    sheet.querySelectorAll('[data-on]').forEach(c=> c.onchange = ()=>{ rows[+c.dataset.on].on = c.checked; redraw(); });
    sheet.querySelectorAll('[data-nm]').forEach(c=> c.oninput = ()=>{ rows[+c.dataset.nm].name = c.value; });
    sheet.querySelectorAll('[data-ct]').forEach(c=>{
      c.oninput = ()=>{ rows[+c.dataset.ct].costText = c.value; };
      c.onchange = ()=> redraw();
    });
    const rp = sheet.querySelector('#pvReplace'); if (rp) rp.onchange = ()=>{ replace = rp.checked; };
  };
  bind();
}

        <tbody>
          <tr><td>Paid</td><td class="tot">${fmt(r.paid.reduce((a,b)=>a+b,0))}</td>${P.map(p=>`<td style="background:${p.color}33">${fmt(r.paid[p.i])}</td>`).join('')}</tr>
          <tr><td>Owes</td><td class="tot">${fmt(r.owes.reduce((a,b)=>a+b,0))}</td>${P.map(p=>`<td style="background:${p.color}33">${fmt(r.owes[p.i])}</td>`).join('')}</tr>
          <tr><td>Net</td><td class="tot">${fmt(r.net.reduce((a,b)=>a+b,0), true)}</td>${P.map(p=>`<td style="background:${p.color}33;font-weight:700" class="${r.net[p.i]<0?'neg':''}">${fmt(r.net[p.i], true)}</td>`).join('')}</tr>
        </tbody>
      </table>
    </div>
    <p class="note">Net: + gets money back, − owes.</p>
  </section>

  <section class="panel">
    <div class="row between" style="flex-wrap:wrap;margin-bottom:12px;gap:8px">
      <h2 class="sub">Items · ${fmt(r.total)}</h2>
      <div class="btnrow">
        <button type="button" class="btn game-btn" id="gmUn" ${unassignedCount?'':'disabled'}>▶ Game Mode: ${unassignedCount} unassigned</button>
        <button type="button" class="btn ghost" id="gmAll" ${state.items.length?'':'disabled'}>▶ Replay all</button>
      </div>
    </div>
    ${state.items.length ? `<div class="tw" id="gridWrap">
      <table class="grid">
        <thead><tr><th>Item</th><th style="text-align:center">Cost</th><th class="paidcol">Paid by</th>
          ${P.map(p=>`<th class="pcol tex" style="--pc:${p.color}">${esc(p.name)}</th>`).join('')}
          <th style="text-align:center"># sharing</th><th><span class="sr">Delete</span></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : `<div class="empty"><strong>No items</strong>Add some below or go back to Items.</div>`}
    <div class="row between" style="margin-top:12px;flex-wrap:wrap">
      <button type="button" class="btn" id="addRow">Add item</button>
      <div class="legend">
        <span><i style="background:${SHARED_COLOR}"></i>Shared item</span>
        <span><i style="background:${WARN_COLOR}"></i>No payer</span>
        <span style="color:var(--warn-ink);font-weight:800">Red name: nobody assigned</span>
      </div>
    </div>
  </section>`;

  const gw = $('#gridWrap'); if (gw) gw.scrollLeft = keepX;
  if (focusKey){ const f = document.querySelector(focusKey); if (f && f !== document.body) f.focus({preventScroll:true}); }
  screenEl.querySelectorAll('[data-pm]').forEach(b=> b.onclick = ()=>{ setPayMode(b.dataset.pm); renderReview(); });
  const ps = $('#payerSel'); if (ps) ps.onchange = e=>{ state.paidInFullBy = e.target.value==='' ? null : +e.target.value; persist(); renderReview(); };
  $('#taxIn').onchange = e=>{ const v = parseExpr(e.target.value); state.taxTipPercent = v==null?0:v; persist(); renderReview(); };
  $('#gmUn').onclick = ()=> startGame('unassigned');
  $('#gmAll').onclick = ()=> startGame('all');
  $('#addRow').onclick = ()=>{
    const it = makeItem(state, '', 0, ''); if (state.payMode === 'bills') it.paidBy = state.billPayer ?? 0;
    state.items.push(it); persist(); renderReview();
    const inp = document.querySelector(`tr[data-id="${it.id}"] [data-f="name"]`); if (inp){ inp.focus(); inp.scrollIntoView({block:'center'}); }
  };
  if (!gw) return;
  gw.addEventListener('click', e=>{
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const it = itemById(+tr.dataset.id); if (!it) return;
    const xb = e.target.closest('[data-x]');
    if (xb){
      const p = +xb.dataset.x;
      if (it.usedBy.has(p)){ it.usedBy.delete(p); Sound.play('erase3'); } else { it.usedBy.add(p); Sound.play('penX'); }
      persist(); renderReview(); return;
    }
    if (e.target.closest('[data-del]')) deleteItem(it.id, renderReview);
  });
  gw.addEventListener('change', e=>{
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const it = itemById(+tr.dataset.id); if (!it) return;
    const f = e.target.dataset.f;
    if (f === 'name'){ it.name = e.target.value.trim(); persist(); return; }
    else if (f === 'cost'){
      const raw = e.target.value.trim(), c = toCents(parseExpr(raw));
      if (c == null){ e.target.classList.add('bad'); nudge(e.target); return; }
      it.costCents = c; it.expr = /[^\d.$\s,]/.test(raw) ? raw : '';
    }
    else if (f === 'paidBy'){ it.paidBy = e.target.value==='d' ? null : +e.target.value; }
    persist(); scheduleReview();
  });
  gw.addEventListener('focusin', e=>{
    // while editing, show the plain number (or the 3×1.15 style sum) without the $
    const t = e.target; if (t.dataset.f === 'cost' && !t.dataset.shown){
      const c = toCents(parseExpr(t.value));
      t.dataset.shown = '1'; t.value = t.dataset.expr || (c != null ? (c/100).toFixed(2) : t.value); t.select();
    }
  });
  gw.addEventListener('focusout', e=>{
    const t = e.target; if (t.dataset.f === 'cost' && t.dataset.shown && !t.classList.contains('bad')){ delete t.dataset.shown; const c = toCents(parseExpr(t.value)); if (c != null) t.value = fmt(c); }
  });
  gw.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.matches('input')) e.target.blur(); });
}

/* =====================================================================
   6. EFFECTS  (shake, confetti, nudge)
   ===================================================================== */
function weightOf(it){
  const max = Math.max(1, ...state.items.map(x=>x.costCents));
  if (!it || it.costCents <= 0) return 0;
  return Math.pow(Math.min(1, it.costCents / max), 1.4);
}
function shake(el, intensity){
  if (!el || motionReduced() || intensity < 0.08 || !el.animate) return;
  const amp = 2 + 20*intensity, rot = 1.8*intensity, dur = 260 + 560*intensity, N = 12;
  const frames = [];
  for (let k=0;k<N;k++){
    const d = Math.pow(1 - k/N, 1.6), sx = k%2 ? 1 : -1;
    frames.push({transform:`translate(${(sx*(0.6+Math.random()*0.4)*amp*d).toFixed(1)}px, ${((Math.random()*2-1)*amp*0.7*d).toFixed(1)}px) rotate(${((Math.random()*2-1)*rot*d).toFixed(2)}deg)`});
  }
  frames.push({transform:'none'});
  el.animate(frames, {duration: dur, easing:'linear'});
}
function nudge(el){
  if (!el || !el.animate || motionReduced()) return;
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-3px)'},{transform:'none'}],{duration:260});
}
function burst(x, y, colors, count=18, spread=110){
  if (motionReduced()) return;
  const fx = $('#fx');
  for (let k=0;k<count;k++){
    const el = document.createElement('i'); el.className = 'conf';
    const size = 6 + Math.random()*7;
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size*(Math.random()<.5?1:.45)}px;background:${colors[k%colors.length]};border-radius:${Math.random()<.5?'50%':'2px'};box-shadow:0 0 0 1px rgba(45,42,64,.12)`;
    fx.appendChild(el);
    const a = Math.random()*Math.PI*2, v = spread*(0.35+Math.random()*0.65);
    const anim = el.animate([
      {transform:'translate(-50%,-50%) scale(1) rotate(0)', opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*v}px), calc(-50% + ${Math.sin(a)*v + 50}px)) scale(.5) rotate(${Math.random()*540-270}deg)`, opacity:0}
    ], {duration: 650 + Math.random()*450, easing:'cubic-bezier(.15,.7,.3,1)'});
    anim.onfinish = ()=> el.remove();
  }
}
function buzz(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch(e){} }

/* =====================================================================
   7. GAME MODE  (intro → round table → optional boss → hands on the table)
   Game Mode only fills in the same `usedBy` data as the grid, so both
   modes end at the same review table and use one calculation.
   ===================================================================== */
const DIRS = {
  L:{x:-1,y:0}, U:{x:0,y:-1}, R:{x:1,y:0}, D:{x:0,y:1},
  UL:{x:-.707,y:-.707}, UR:{x:.707,y:-.707}, DL:{x:-.707,y:.707}, DR:{x:.707,y:.707},
};
const PERSON_DIR = ['L','U','R','UL','UR','DL'];   // where each person sits = the swipe direction that gives them the card
const ENTRANCES = [
  {cls:'e-drop', dur:780, hit:.6}, {cls:'e-slideL', dur:720, hit:.64}, {cls:'e-spin', dur:740, hit:.7},
  {cls:'e-zoom', dur:600, hit:.55}, {cls:'e-slideR', dur:720, hit:.64}, {cls:'e-flip', dur:720, hit:.6}, {cls:'e-wobble', dur:900, hit:.3},
];
const HEAVY = {cls:'e-heavy', dur:950, hit:.55};
const DEFAULT_HINT = 'Swipe the card toward a player, <b>hold it</b> for a menu, or <b>tap a name</b>.';

let game = null, busy = false, drag = null, rafId = 0, lastEntrance = -1, radial = null, chargeTimer = null;

const eightWay = () => state.count >= 4;
const activeDirs = () => eightWay() ? ['L','U','R','D','UL','UR','DL','DR'] : ['L','U','R','D'];
function later(fn, ms){ const id = setTimeout(fn, ms); if (game) game.timers.push(id); return id; }
function shortName(n){ n = String(n||'Mystery item').replace(/\s*\(.*?\)\s*/g,' ').trim(); return n.length > 26 ? n.slice(0,25) + '…' : n; }

function targetFor(dir){
  const n = state.count;
  switch (dir){
    case 'L': return {type:'person', p:0};
    case 'U': return {type:'person', p:1};
    case 'R': return n>=3 ? {type:'person', p:2} : {type:'skip'};
    case 'D': return {type:'all'};
    case 'UL': return n>=4 ? {type:'person', p:3} : null;
    case 'UR': return n>=5 ? {type:'person', p:4} : null;
    case 'DL': return n>=6 ? {type:'person', p:5} : null;
    case 'DR': return eightWay() ? {type:'skip'} : null;
  }
  return null;
}
function dirFromVector(dx, dy){
  const a = Math.atan2(dy, dx) * 180 / Math.PI;
  if (eightWay()) return ['R','DR','D','DL','L','UL','U','UR'][((Math.round(a/45) % 8) + 8) % 8];
  return ['R','D','L','U'][((Math.round(a/90) % 4) + 4) % 4];
}
function dirForTarget(t){
  if (t.type==='person') return PERSON_DIR[t.p];
  if (t.type==='all') return 'D';
  if (t.type==='skip') return state.count===2 ? 'R' : 'DR';
  return 'D';
}
function colorForTarget(t){
  if (!t) return null;
  if (t.type==='person') return PERSON_COLORS[t.p];
  if (t.type==='all') return SHARED_COLOR;
  if (t.type==='set') return t.set.length===1 ? PERSON_COLORS[t.set[0]] : SHARED_COLOR;
  return '#ffffff';
}

/* ---------- start / stop ---------- */
function startGame(mode){
  if (!state.items.length || state.count < 2) return;
  let ids = state.items.filter(it => mode==='all' ? true : !usersOf(it,state).length).map(it=>it.id);
  if (!ids.length) ids = state.items.map(it=>it.id);
  // Boss battle: decided when dealing, so the music knows how many cards are left before it.
  let bossId = null;
  const force = state.settings.bossAlways || /boss/.test(location.hash);
  if (ids.length >= 3 && (force || Math.random() < BOSS_CHANCE)){
    bossId = ids.reduce((b,id)=> itemById(id).costCents > itemById(b).costCents ? id : b, ids[0]);
    ids = ids.filter(id=>id!==bossId);
    const n = ids.length + 1, lo = Math.max(Math.min(MARCH_LEAD, n-1), Math.floor(n/2)), hi = n - 1;
    ids.splice(lo + Math.floor(Math.random()*(hi-lo+1)), 0, bossId);
  }
  game = {queue: ids.slice(), total: ids.length, history: [], bossId, bossDone: false, phase: 'intro',
          returnTo: state.screen, timers: [], reswipeAll: mode==='all' || ids.length===state.items.length, hp: 0, maxHp: 0};
  closeSheet();
  $('#game').hidden = false; document.body.classList.add('locked');
  $('#arena').className = 'arena' + (eightWay() ? ' eight' : '');
  $('#gPlay').hidden = false; $('#gBoss').hidden = true; $('#gEnd').hidden = true;
  $('#gHint').innerHTML = DEFAULT_HINT;
  $('#deck').innerHTML = '';
  buildSeats(); updateProgress(); updateMusicBtn();
  Sound.play('divChime');
  runIntro(beginPlay);
}
function beginPlay(){
  if (!game) return;
  game.phase = 'play';
  Sound.play('shuffle4');
  showCard();
}
function closeGame(to){
  if (!game) return;
  game.timers.forEach(clearTimeout);
  stopCharge(); closeRadial(); closeSheet();
  Sound.stopMusic(0.5);
  const back = game.returnTo;
  game = null; busy = false; drag = null;
  const g = $('#game');
  g.hidden = true; g.classList.remove('intro-on');
  g.querySelectorAll('.intro,.boss-hud,.end-panel,.boss-banner,.flash-red').forEach(x=>x.remove());
  document.querySelectorAll('.dmg,.boom,.flyer').forEach(x=>x.remove());
  document.body.classList.remove('locked');
  $('#deck').innerHTML = ''; $('#arena').className = 'arena';
  go(to || back);
}

/* ---------- intro: clouds, then each player's eyes and name ---------- */
function runIntro(done){
  const g = $('#game'), P = people(), rm = motionReduced();
  g.classList.add('intro-on');
  const intro = document.createElement('div');
  intro.className = 'intro';
  intro.innerHTML = `
    ${rm ? '' : `<div class="clouds" aria-hidden="true"><div class="cloud cl-a"></div><div class="cloud cl-b"></div><div class="cloud cl-c"></div><div class="cloud cl-d"></div></div>`}
    <div class="shut top"><div class="load">LOADING PLAYERS</div></div>
    <div class="shut bot"><div class="lbar"><i></i></div></div>
    <div class="band-host" aria-live="polite"></div>
    <button type="button" class="g-btn skip" data-skip>Skip ›</button>`;
  g.append(intro);
  const host = intro.querySelector('.band-host'), bar = intro.querySelector('.lbar i');
  let finished = false;
  const finish = ()=>{
    if (finished || !game) return; finished = true;
    game.timers.forEach(clearTimeout); game.timers = [];
    intro.classList.remove('band','closed'); host.innerHTML = '';
    g.classList.remove('intro-on');
    intro.classList.add('out');
    setTimeout(()=>{ intro.remove(); }, 460);
    later(done, rm ? 0 : 260);
  };
  intro.querySelector('[data-skip]').onclick = e=>{ e.stopPropagation(); finish(); };
  game.skipIntro = finish;

  const start = rm ? 0 : 650, per = rm ? 1000 : 1100;
  later(()=>{ intro.classList.add('closed'); Sound.play('introTaiko'); }, rm ? 0 : 550);
  later(()=>{ intro.classList.remove('closed'); intro.classList.add('band'); }, start + (rm ? 50 : 850));
  P.forEach((p, k)=>{
    later(()=>{
      const band = document.createElement('div');
      band.className = 'pband tex';
      band.style.setProperty('--pc', p.color);
      band.innerHTML = `<div class="eyes">${avatarSVG(p.i,'eyes')}</div>
        <div class="ptag">PLAYER ${p.i+1}</div>
        <div class="pname" style="font-family:'${PLAYER_FONTS[p.i]}',var(--display)">${esc(p.name)}</div>`;
      host.innerHTML = ''; host.append(band);
      bar.style.width = ((k+1)/P.length*100) + '%';
      Sound.play('sting', k);
      buzz(12);
    }, start + (rm ? 100 : 1000) + k * per);
  });
  const endAt = start + (rm ? 100 : 1000) + P.length * per;
  later(()=>{
    host.innerHTML = `<div class="intro-go">LET'S SPLIT!</div>`;
    intro.classList.add('closed');
    Sound.play('hit', 0.7);
  }, endAt);
  later(finish, endAt + (rm ? 700 : 1000));
}

/* ---------- seats and hands ---------- */
function buildSeats(){
  const conic = `conic-gradient(${people().map((p,i,a)=>`${p.color} ${i/a.length*360}deg ${(i+1)/a.length*360}deg`).join(',')})`;
  $('#seats').innerHTML = activeDirs().map(d=>{
    const t = targetFor(d); if (!t) return '';
    if (t.type === 'person'){
      const p = t.p, nm = esc(personName(state,p));
      return `<div class="seat s-${d}" data-dir="${d}" style="--pc:${PERSON_COLORS[p]}">
        <button type="button" class="av" data-seat="${p}" aria-label="Give the card to ${nm}">${avatarSVG(p)}</button>
        <button type="button" class="nm tex" data-seat="${p}" aria-label="Give the card to ${nm}">${nm}</button>
        <div class="hand" data-hand="${p}" aria-hidden="true"></div><div class="hc" data-hc="${p}"></div></div>`;
    }
    if (t.type === 'all') return `<div class="seat s-${d}" data-dir="${d}" style="--pc:${SHARED_COLOR}">
        <button type="button" class="av" data-seat="all" aria-label="Everyone shares it" style="background:${conic}"><span class="grp">✦</span></button>
        <button type="button" class="nm tex" data-seat="all">Everyone</button></div>`;
    return `<div class="seat skipseat s-${d}" data-dir="${d}">
        <button type="button" class="av" data-seat="skip" aria-label="Skip for now">↻</button>
        <button type="button" class="nm" data-seat="skip">Skip</button></div>`;
  }).join('');
  renderHands();
}
function handItems(p){
  const q = new Set(game ? game.queue : []);
  return state.items.filter(it => it.usedBy.has(p) && !q.has(it.id));
}
function renderHands(bump){
  const ending = !!(game && game.phase === 'end');
  for (let p = 0; p < state.count; p++){
    const el = document.querySelector(`#seats [data-hand="${p}"]`); if (!el) continue;
    const its = handItems(p), n = its.length;
    const show = its.slice(-(ending ? 7 : 5)), m = show.length;
    el.innerHTML = show.map((it,k)=>{
      const c = k - (m-1)/2;
      return `<i style="transform:translateX(${(c*(ending?11:6)).toFixed(1)}px) rotate(${(c*(ending?9:8)).toFixed(1)}deg)">${emojiFor(it.name)}</i>`;
    }).join('') + `<b>${n || ''}</b>`;
    const hc = document.querySelector(`#seats [data-hc="${p}"]`);
    if (hc) hc.textContent = `${n} card${n===1?'':'s'}`;
    if (bump && bump.has(p) && !motionReduced()){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
}
function seatCenter(dir){
  const s = document.querySelector(`#seats [data-dir="${dir}"] .av`); if (!s) return null;
  const r = s.getBoundingClientRect(); return {x: r.left + r.width/2, y: r.top + r.height/2};
}
function updateProgress(){
  if (!game) return;
  const done = game.total - game.queue.length;
  $('#gCount').textContent = game.queue.length ? `${Math.min(done+1, game.total)} of ${game.total}` : `${game.total} of ${game.total}`;
  $('#gBar').style.width = (done / game.total * 100) + '%';
  $('#gUndo').disabled = !game.history.length || game.phase !== 'play';
}
function updateMusicBtn(){
  const b = $('#gMusic'), on = state.settings.music;
  b.textContent = on ? '♪' : '♪̸'; b.setAttribute('aria-pressed', on); b.style.opacity = on ? '' : '.55';
}
function toggleMusic(){
  state.settings.music = !state.settings.music; persist();
  Sound.applyVolumes();
  if (state.settings.music && game) Sound.music(musicFor()); else Sound.setMusicEnabled();
  updateMusicBtn();
}
function musicFor(){
  if (!game) return null;
  if (game.phase === 'boss') return 'chase';
  if (game.bossId && !game.bossDone){
    const k = game.queue.indexOf(game.bossId);
    if (k >= 1 && k <= MARCH_LEAD) return 'march';
  }
  return 'tension';
}

/* ---------- the card ---------- */
function cardHTML(it, role){
  const pal = PALETTES[it.id % PALETTES.length];
  const tilt = (((it.id * 37) % 7) - 3) * 0.9;
  const u = usersOf(it, state);
  const now = role === 'top' && game && game.reswipeAll && u.length ? `<div class="c-now">now: ${u.length===state.count?'everyone':u.map(p=>esc(personName(state,p))).join(', ')}</div>` : '';
  if (role === 'boss') return `<div class="card boss" style="--tilt:0deg">
      <div class="tint"></div>
      <div class="c-emoji">${emojiFor(it.name)}<div class="boss-eyes">${bossEyesSVG()}</div></div>
      <div class="c-name">${esc(it.name || 'Mystery item')}</div>
      <div class="c-cost">${fmt(it.costCents)}</div>
    </div>`;
  return `<div class="card tex ${pal.pat} ${role==='peek'?'peek':''}" style="--c1:${pal.c1};--c2:${pal.c2};--cink:${pal.ink};--tilt:${role==='peek'?0:tilt}deg">
    <div class="tint"></div>
    <div class="c-emoji ${role==='top'?'pop':''}" aria-hidden="true">${emojiFor(it.name)}</div>
    <div class="c-name">${esc(it.name || 'Untitled item')}</div>
    <div class="c-cost">${fmt(it.costCents)}</div>${now}
  </div>`;
}
function showCard(entranceOverride){
  if (!game) return;
  updateProgress(); renderHands();
  if (!game.queue.length){ endGame(); return; }
  const it = itemById(game.queue[0]);
  if (!it){ game.queue.shift(); game.total = Math.max(game.queue.length, game.total - 1); showCard(); return; }
  if (it.id === game.bossId && !game.bossDone){ startBoss(it); return; }
  Sound.music(musicFor());
  $('#gHint').innerHTML = it.id === game.bossId ? '<b>Boss defeated!</b> Now choose who shares it.' : DEFAULT_HINT;
  const nextIt = game.queue.length > 1 ? itemById(game.queue[1]) : null;
  const w = weightOf(it);
  let ent;
  if (entranceOverride) ent = entranceOverride;
  else if (w >= .45) ent = HEAVY;
  else { let k; do { k = Math.floor(Math.random()*ENTRANCES.length); } while (k === lastEntrance && ENTRANCES.length > 1); lastEntrance = k; ent = ENTRANCES[k]; }

  $('#deck').innerHTML = (nextIt && nextIt.id !== game.bossId ? `<div class="card-enter" style="pointer-events:none">${cardHTML(nextIt,'peek')}</div>` : '') +
    `<div class="card-drag" id="topCard" tabindex="0" role="button" aria-label="${esc(it.name)}, ${fmt(it.costCents)}. Press Enter for the menu.">
       <div class="card-enter ${ent.cls}" style="animation-duration:${ent.dur}ms">
         <div class="card-bob">${cardHTML(it,'top')}</div>
       </div>
     </div>`;
  const top = $('#topCard');
  top.addEventListener('pointerdown', onDown);
  top.addEventListener('pointermove', onMove);
  top.addEventListener('pointerup', onUp);
  top.addEventListener('pointercancel', onCancel);
  top.addEventListener('contextmenu', e=> e.preventDefault());
  busy = true;
  const land = motionReduced() ? 0 : ent.dur * ent.hit;
  later(()=>{
    if (!game) return;
    shake($('#gShell'), w * 0.8);
    if (w >= .45){
      const r = top.getBoundingClientRect();
      burst(r.left + r.width*.2, r.bottom - 10, ['#ffffff','#DCDCE6'], 8, 70);
      burst(r.right - r.width*.2, r.bottom - 10, ['#ffffff','#DCDCE6'], 8, 70);
      buzz(20);
    }
  }, land);
  later(()=>{ busy = false; }, motionReduced() ? 0 : Math.min(ent.dur, 420));
}

/* ---------- drag (swipe toward a player) and hold (radial menu) ---------- */
function commitDistance(){
  const st = $('#arena').getBoundingClientRect();
  return Math.max(60, Math.min(120, Math.min(st.width, st.height) * 0.22));
}
function onDown(e){
  if (busy || !game || game.phase !== 'play' || !game.queue.length || (e.button !== undefined && e.button !== 0)) return;
  const el = e.currentTarget;
  try { el.setPointerCapture(e.pointerId); } catch(_){}
  drag = {id:e.pointerId, el, x0:e.clientX, y0:e.clientY, dx:0, dy:0, moved:false, radial:false, pts:[{x:e.clientX,y:e.clientY,t:performance.now()}], dist:commitDistance()};
  drag.lp = setTimeout(()=>{
    if (drag && !drag.moved){ drag.radial = true; $('#deck').classList.remove('dragging'); springBack(drag.el); openRadial(drag.x0, drag.y0); }
  }, 480);
  $('#deck').classList.add('dragging');
  el.getAnimations && el.getAnimations().forEach(a=>a.cancel());
  el.style.transition = 'none';
}
function onMove(e){
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.radial){ radialHover(e.clientX, e.clientY); return; }
  drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(drag.dx, drag.dy) > 8){ drag.moved = true; clearTimeout(drag.lp); }
  const now = performance.now();
  drag.pts.push({x:e.clientX, y:e.clientY, t:now});
  while (drag.pts.length > 2 && now - drag.pts[0].t > 100) drag.pts.shift();
  if (!rafId) rafId = requestAnimationFrame(frame);
}
function frame(){
  rafId = 0; if (!drag || drag.radial) return;
  const {dx, dy, el} = drag;
  el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.06}deg)`;
  const d = Math.hypot(dx, dy);
  const dir = d > 12 ? dirFromVector(dx, dy) : null;
  const t = dir ? targetFor(dir) : null;
  highlight(t ? dir : null, Math.min(1, d / drag.dist), t);
}
function highlight(dir, p, t){
  document.querySelectorAll('#seats .seat').forEach(s=>{
    const on = s.dataset.dir === dir;
    s.style.setProperty('--s', on ? (1 + 0.25*p).toFixed(3) : '1');
    s.classList.toggle('hot', !!(on && p >= 1));
  });
  const tint = document.querySelector('#topCard .tint');
  if (tint){
    const c = t ? colorForTarget(t) : null;
    tint.style.setProperty('--tc', c || 'transparent');
    tint.style.opacity = c ? (0.65 * p).toFixed(2) : '0';
  }
}
function onUp(e){
  if (!drag || e.pointerId !== drag.id) return;
  clearTimeout(drag.lp);
  const d = drag; drag = null; cancelAnimationFrame(rafId); rafId = 0;
  $('#deck').classList.remove('dragging');
  if (d.radial){ if (radial && radial.hot >= 0) chooseRadial(radial.hot); return; }
  if (!d.moved){ springBack(d.el); return; }
  const a = d.pts[0], b = d.pts[d.pts.length-1], dt = Math.max(1, b.t - a.t);
  const vx = (b.x - a.x)/dt, vy = (b.y - a.y)/dt, speed = Math.hypot(vx, vy);
  const dist = Math.hypot(d.dx, d.dy), dir = dirFromVector(d.dx, d.dy), t = targetFor(dir);
  const fling = speed > 0.6 && dist > 35 && (vx*d.dx + vy*d.dy) > 0;
  if (t && (dist >= d.dist || fling)) act(t, dir, {dx:d.dx, dy:d.dy});
  else { if (!t && dist >= d.dist) nudge($('#deck')); springBack(d.el); }
}
function onCancel(){
  if (!drag) return; clearTimeout(drag.lp);
  const d = drag; drag = null; $('#deck').classList.remove('dragging');
  if (!d.radial) springBack(d.el);
}
function springBack(el){
  highlight(null, 0, null);
  if (!el) return;
  el.style.transition = motionReduced() ? 'none' : 'transform .45s cubic-bezier(.3,1.6,.5,1)';
  el.style.transform = '';
}

/* radial menu: hold the card, then slide to a bubble and let go (or tap one) */
function radialOptions(){
  const o = people().map(p=>({t:{type:'person',p:p.i}, label:p.name, color:p.color, av:avatarSVG(p.i)}));
  o.push({t:{type:'all'}, label:'Everyone', color:SHARED_COLOR, big:'✦'});
  o.push({split:true, label:'Split…', color:'#fff', big:'⚖', util:true});
  o.push({t:{type:'skip'}, label:'Skip', color:'#fff', big:'↻', util:true});
  return o;
}
function openRadial(cx, cy, viaKeyboard){
  closeRadial();
  if (!game || game.phase !== 'play') return;
  const opts = radialOptions(), n = opts.length;
  const R = clamp(n * 13, 92, 120);
  cx = clamp(cx, R + 38, innerWidth - R - 38); cy = clamp(cy, R + 38, innerHeight - R - 38);
  const back = document.createElement('div'); back.className = 'radial-back';
  const el = document.createElement('div'); el.className = 'radial';
  el.style.left = cx + 'px'; el.style.top = cy + 'px';
  el.setAttribute('role','menu'); el.setAttribute('aria-label','Give this card to');
  el.innerHTML = `<div class="hub"></div>` + opts.map((o,i)=>{
    const a = -Math.PI/2 + i * 2 * Math.PI / n; o.a = a;
    const x = Math.cos(a) * R, y = Math.sin(a) * R;
    return `<button type="button" role="menuitem" class="rb ${o.util?'util':''}" data-rb="${i}" style="--pc:${o.color};--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;animation-delay:${i*18}ms">${o.av || `<span class="big">${o.big}</span>`}<span>${esc(o.label)}</span></button>`;
  }).join('');
  $('#game').append(back, el);
  radial = {opts, el, back, cx, cy, hot: -1};
  back.addEventListener('click', closeRadial);
  el.addEventListener('click', e=>{ const b = e.target.closest('[data-rb]'); if (b) chooseRadial(+b.dataset.rb); });
  buzz(15); Sound.play('tapPaper');
  if (viaKeyboard){ const f = el.querySelector('.rb'); if (f) f.focus(); }
}
function radialHover(x, y){
  if (!radial) return;
  const dx = x - radial.cx, dy = y - radial.cy;
  let hot = -1;
  if (Math.hypot(dx, dy) > 40){
    const a = Math.atan2(dy, dx); let bd = 9;
    radial.opts.forEach((o,i)=>{ const diff = Math.abs(((a - o.a + Math.PI*3) % (Math.PI*2)) - Math.PI); if (diff < bd){ bd = diff; hot = i; } });
  }
  if (hot !== radial.hot){
    radial.hot = hot;
    radial.el.querySelectorAll('.rb').forEach((b,i)=> b.classList.toggle('hot', i === hot));
    if (hot >= 0){ buzz(5); Sound.play('tick'); }
  }
}
function chooseRadial(i){
  const o = radial && radial.opts[i]; closeRadial(); if (!o) return;
  if (o.split) openSplit(); else act(o.t);
}
function closeRadial(){ if (!radial) return; radial.el.remove(); radial.back.remove(); radial = null; }

/* ---------- assigning ---------- */
async function act(t, dir, from){
  if (busy || !game || game.phase !== 'play' || !game.queue.length) return;
  closeRadial();
  busy = true;
  dir = dir || dirForTarget(t);
  const id = game.queue[0], it = itemById(id), el = $('#topCard'), w = weightOf(it);
  const targets = t.type==='person' ? [t.p] : t.type==='all' ? people().map(p=>p.i) : t.type==='set' ? t.set.slice() : [];
  Sound.play('whoosh');
  if (t.type !== 'skip') buzz(w >= .45 ? [18,40,24] : 10);
  await flyToSeats(el, dir, from || {dx:0, dy:0}, t, targets, it);
  if (!game){ busy = false; return; }
  game.queue.shift();
  const prev = new Set(it.usedBy);
  if (t.type === 'skip'){ game.queue.push(id); game.history.push({id, prev, skip:true}); }
  else { it.usedBy = new Set(targets); game.history.push({id, prev}); Sound.play('assign'); }
  persist();
  renderHands(new Set(targets));
  if (t.type !== 'skip') targets.forEach(p=>{
    const c = seatCenter(PERSON_DIR[p]);
    if (c) burst(c.x, c.y, [PERSON_COLORS[p], '#ffffff', SHARED_COLOR], 8 + Math.round(10*w), 55 + 50*w);
  });
  busy = false;
  showCard();
}
function flyToSeats(el, dir, from, t, targets, it){
  return new Promise(res=>{
    highlight(null, 0, null);
    if (!el || !el.animate){ res(); return; }
    const tint = el.querySelector('.tint');
    if (tint && t.type !== 'skip'){ tint.style.setProperty('--tc', colorForTarget(t)); tint.style.opacity = '.55'; }
    const r = el.getBoundingClientRect();
    const ox = r.left + r.width/2 - from.dx, oy = r.top + r.height/2 - from.dy;
    const r0 = from.dx * 0.06, start = `translate(${from.dx}px, ${from.dy}px) rotate(${r0}deg)`;
    el.style.transition = 'none';
    if (motionReduced()){ const a = el.animate([{opacity:1},{opacity:0}], {duration:150, fill:'forwards'}); a.onfinish = res; return; }
    const multi = t.type === 'all' || t.type === 'set';
    if (!multi){
      const dest = seatCenter(t.type === 'person' ? PERSON_DIR[t.p] : dir);
      let end;
      if (dest){ const tx = dest.x - ox, ty = dest.y - oy; end = `translate(${tx}px, ${ty}px) rotate(${r0 + (tx > 0 ? 24 : -24)}deg) scale(.16)`; }
      else { const v = DIRS[dir], far = Math.max(innerWidth, innerHeight) * 1.2; end = `translate(${from.dx + v.x*far}px, ${from.dy + v.y*far}px) rotate(${r0 + v.x*28}deg)`; }
      const a = el.animate([{transform:start, opacity:1}, {transform:end, opacity:.85}], {duration:430, easing:'cubic-bezier(.5,0,.75,.35)', fill:'forwards'});
      a.onfinish = res; a.oncancel = res; return;
    }
    // Shared: the card shrinks on the table and a copy flies into each person's hand
    el.animate([{transform:start, opacity:1}, {transform:'translate(0,0) scale(.3)', opacity:0}], {duration:260, easing:'ease-in', fill:'forwards'});
    const emo = emojiFor(it.name);
    let left = targets.length;
    if (!left){ res(); return; }
    setTimeout(()=>{
      targets.forEach((p,k)=>{
        const d = seatCenter(PERSON_DIR[p]);
        if (!d){ if (--left === 0) res(); return; }
        const f = document.createElement('div');
        f.className = 'flyer'; f.textContent = emo;
        f.style.cssText = `left:${ox-16}px;top:${oy-22}px;width:32px;height:44px;--pc:${PERSON_COLORS[p]}`;
        document.body.append(f);
        const an = f.animate([
          {transform:'scale(.5)', opacity:0},
          {transform:'scale(1.15)', opacity:1, offset:.25},
          {transform:`translate(${d.x-ox}px, ${d.y-oy}px) scale(.6) rotate(${k%2?20:-20}deg)`, opacity:.9}
        ], {duration:400, delay:k*30, easing:'cubic-bezier(.4,0,.6,1)', fill:'forwards'});
        an.onfinish = ()=>{ f.remove(); if (--left === 0) res(); };
      });
    }, 120);
  });
}
function undo(){
  if (busy || !game || game.phase !== 'play' || !game.history.length) return;
  closeSheet(); closeRadial();
  const h = game.history.pop(), it = itemById(h.id);
  if (h.skip){ const k = game.queue.lastIndexOf(h.id); if (k >= 0) game.queue.splice(k,1); }
  if (it) it.usedBy = new Set(h.prev);
  game.queue.unshift(h.id);
  persist();
  Sound.play('erase3');
  showCard({cls:'e-zoom', dur:600, hit:.55});
}

/* split picker (any group of people) */
function openSplit(){
  if (!game || game.phase !== 'play' || !game.queue.length) return;
  const it = itemById(game.queue[0]); if (!it) return;
  const sel = new Set(usersOf(it, state));
  const draw = ()=>{
    const all = sel.size === state.count;
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <h2 id="shT">Split between…</h2>
      <p class="one">${esc(emojiFor(it.name))} ${esc(it.name)} · ${fmt(it.costCents)}${sel.size>1?` · about ${fmt(Math.round(it.costCents/sel.size))} each`:''}</p>
      <div class="chips">
        ${people().map(p=>`<button type="button" class="chip" style="--pc:${p.color}" data-chip="${p.i}" aria-pressed="${sel.has(p.i)}">${esc(p.name)}</button>`).join('')}
        <button type="button" class="chip" style="--pc:${SHARED_COLOR}" data-chip="all" aria-pressed="${all}">Everyone</button>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" data-sh="cancel">Cancel</button>
        <button type="button" class="btn primary" data-sh="ok" ${sel.size?'':'disabled'}>${sel.size ? `Split between ${sel.size}` : 'Pick at least one'}</button>
      </div>
    </div>`;
  };
  const sheet = openSheet(draw(), e=>{
    const c = e.target.closest('[data-chip]');
    if (c){
      const v = c.dataset.chip;
      if (v === 'all'){ if (sel.size === state.count) sel.clear(); else people().forEach(p=>sel.add(p.i)); }
      else { const p = +v; if (sel.has(p)){ sel.delete(p); Sound.play('erase3'); } else { sel.add(p); Sound.play('penX'); } }
      sheet.innerHTML = draw(); const again = sheet.querySelector(`[data-chip="${v}"]`); if (again) again.focus(); return;
    }
    const b = e.target.closest('[data-sh]'); if (!b) return;
    if (b.dataset.sh === 'cancel'){ closeSheet(); return; }
    const set = [...sel].sort((a,b)=>a-b); closeSheet();
    act(set.length === state.count ? {type:'all'} : set.length === 1 ? {type:'person', p:set[0]} : {type:'set', set});
  });
  const first = sheet.querySelector('[data-chip]'); if (first) first.focus();
}

/* ---------- boss battle ---------- */
function startBoss(it){
  game.phase = 'boss'; busy = true;
  updateProgress();
  const arena = $('#arena'), mini = isMiniBoss(it.costCents);
  $('#gPlay').hidden = true;
  Sound.duck(0.2, 2.4); Sound.play('announce'); Sound.music('chase');
  buzz([30,60,30,60,80]);
  const ban = document.createElement('div');
  ban.className = 'boss-banner'; ban.setAttribute('role','alert');
  ban.innerHTML = `<small>WARNING</small><strong>${mini ? 'MINI-BOSS' : 'BOSS BATTLE'}</strong><em>${esc(emojiFor(it.name))} ${esc(shortName(it.name))} · ${fmt(it.costCents)}</em>`;
  const flash = document.createElement('div'); flash.className = 'flash-red';
  arena.append(flash, ban);
  $('#deck').innerHTML = '';
  later(()=>{ ban.remove(); flash.remove(); if (game) renderBoss(it); }, motionReduced() ? 1400 : 2100);
}
function renderBoss(it){
  game.maxHp = game.hp = bossHP(it.costCents);
  const arena = $('#arena');
  arena.classList.add('fighting');
  const hud = document.createElement('div');
  hud.className = 'boss-hud'; hud.id = 'bossHud';
  hud.innerHTML = `<div class="hp-name"><span>${isMiniBoss(it.costCents)?'Mini-boss':'Boss'} · ${esc(shortName(it.name))}</span><span id="hpNum"></span></div><div class="hp" id="hpBar"><i></i></div>`;
  arena.append(hud);
  $('#deck').innerHTML = `<div class="card-drag" id="topCard" tabindex="0" role="button" aria-label="Boss: ${esc(it.name)}. Tap or press Space to attack.">
    <div class="card-enter e-boss"><div class="card-bob">${cardHTML(it,'boss')}</div></div></div>`;
  $('#gBoss').hidden = false;
  const top = $('#topCard');
  top.addEventListener('pointerdown', e=>{ e.preventDefault(); bossHit(1, e.clientX, e.clientY); });
  top.addEventListener('contextmenu', e=> e.preventDefault());
  top.focus({preventScroll:true});
  updateHP();
  busy = false;
}
function updateHP(){
  const bar = $('#hpBar'); if (!bar || !game) return;
  bar.querySelector('i').style.width = (game.hp / game.maxHp * 100) + '%';
  bar.classList.toggle('low', game.hp / game.maxHp < .3);
  $('#hpNum').textContent = `${game.hp} / ${game.maxHp}`;
}
function bossHit(n, x, y, fromCharge){
  if (!game || game.phase !== 'boss' || game.hp <= 0) return;
  const crit = !fromCharge && Math.random() < .12, dmg = crit ? 2 : n;
  game.hp = Math.max(0, game.hp - dmg);
  Sound.play('hit', 0.8 + Math.random() * 0.5);
  buzz(8);
  const card = document.querySelector('#topCard .card');
  if (card && !motionReduced()){ card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit'); }
  if (!motionReduced() && x != null){
    const d = document.createElement('div');
    d.className = 'dmg' + (crit ? ' crit' : ''); d.textContent = crit ? 'CRIT!' : '-' + dmg;
    d.style.left = (x + Math.random()*30 - 15) + 'px'; d.style.top = y + 'px';
    document.body.append(d); setTimeout(()=> d.remove(), 720);
  }
  updateHP();
  if (game.hp <= 0) defeatBoss();
}
function startCharge(){
  if (!game || game.phase !== 'boss' || chargeTimer) return;
  const btn = $('#chargeBtn'), fill = btn.querySelector('i');
  let k = 0;
  const step = ()=>{
    if (!game || game.phase !== 'boss'){ stopCharge(); return; }
    const card = $('#topCard'), r = card ? card.getBoundingClientRect() : null;
    bossHit(1, r ? r.left + r.width*(.3 + Math.random()*.4) : null, r ? r.top + r.height*.3 : null, true);
    k++; fill.style.width = Math.min(100, k / Math.max(1, game.maxHp) * 100) + '%';
  };
  step();
  chargeTimer = setInterval(step, 110);
}
function stopCharge(){
  clearInterval(chargeTimer); chargeTimer = null;
  const f = document.querySelector('#chargeBtn i'); if (f) f.style.width = '0';
}
(function bindCharge(){
  const b = $('#chargeBtn');
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} startCharge(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=> b.addEventListener(ev, stopCharge));
  b.addEventListener('keydown', e=>{ if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); e.stopPropagation(); startCharge(); } });
  b.addEventListener('keyup', e=>{ if (e.key === ' ' || e.key === 'Enter') stopCharge(); });
  b.addEventListener('contextmenu', e=> e.preventDefault());
})();
function boom(x, y){
  if (motionReduced()) return;
  const b = document.createElement('div'); b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
  document.body.append(b); setTimeout(()=> b.remove(), 650);
}
function defeatBoss(){
  game.bossDone = true; game.phase = 'defeat';
  stopCharge();
  Sound.duck(0.15, 2.0); Sound.play('defeat');
  buzz([40,30,80]);
  const top = $('#topCard'), card = top && top.querySelector('.card');
  if (top){
    const r = top.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    boom(cx, cy);
    burst(cx, cy, ['#FFE08A','#FF7A45','#FF3B5C','#ffffff'], 40, 200);
    shake($('#gShell'), 1);
  }
  const eyes = card && card.querySelector('.boss-eyes');
  if (eyes && eyes.animate && !motionReduced()) eyes.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(1.9)'}], {duration:420, fill:'forwards'});
  else if (eyes) eyes.style.opacity = '0';
  if (card) card.insertAdjacentHTML('beforeend', '<div class="stamp">DEFEATED</div>');
  $('#gBoss').hidden = true;
  later(()=>{
    if (!game) return;
    const hud = $('#bossHud'); if (hud) hud.remove();
    $('#arena').classList.remove('fighting');
    game.phase = 'play'; $('#gPlay').hidden = false;
    Sound.music('tension');            // back to the main song once the fanfare has played
    showCard({cls:'e-zoom', dur:600, hit:.55});
  }, motionReduced() ? 900 : 1900);
}
function skipFight(){
  if (!game || game.phase !== 'boss') return;
  stopCharge();
  game.bossDone = true;
  const hud = $('#bossHud'); if (hud) hud.remove();
  $('#arena').classList.remove('fighting');
  $('#gBoss').hidden = true;
  game.phase = 'play'; $('#gPlay').hidden = false;
  Sound.music('tension');
  showCard({cls:'e-zoom', dur:600, hit:.55});
}

/* ---------- end: every player's hand on the table ---------- */
function endGame(){
  game.phase = 'end'; busy = true; closeRadial();
  Sound.stopMusic(1.2);
  const arena = $('#arena');
  arena.classList.add('ending');
  $('#gPlay').hidden = true; $('#gBoss').hidden = true; $('#gEnd').hidden = false;
  $('#deck').innerHTML = '';
  renderHands(new Set(people().map(p=>p.i)));
  const left = state.items.filter(it=>!usersOf(it,state).length).length;
  const panel = document.createElement('div');
  panel.className = 'end-panel';
  panel.innerHTML = `<div class="ep"><h2>Hands on the table</h2><p>${game.total} card${game.total===1?'':'s'} dealt${left ? ` · ${left} still unassigned` : ''}</p></div>`;
  arena.append(panel);
  Sound.play('divChime');
  updateProgress();
  const fin = document.querySelector('#gEnd [data-g="finish"]'); if (fin) fin.focus({preventScroll:true});
}

/* ---------- buttons, keys and boss eyes ---------- */
$('#game').addEventListener('click', e=>{
  if (!game) return;
  const s = e.target.closest('[data-seat]');
  if (s){
    if (game.phase !== 'play') return;
    const v = s.dataset.seat;
    act(v === 'all' ? {type:'all'} : v === 'skip' ? {type:'skip'} : {type:'person', p:+v});
    return;
  }
  const b = e.target.closest('[data-g]'); if (!b) return;
  const k = b.dataset.g;
  if (k === 'close') closeGame();
  else if (k === 'undo') undo();
  else if (k === 'skip') act({type:'skip'});
  else if (k === 'split') openSplit();
  else if (k === 'skipfight') skipFight();
  else if (k === 'music') toggleMusic();
  else if (k === 'finish') closeGame('review');
});
$('#game').addEventListener('pointermove', e=>{
  if (!game || game.phase !== 'boss') return;
  const eyes = document.querySelector('#topCard .boss-eyes'); if (!eyes) return;
  const r = eyes.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2), d = Math.hypot(dx, dy) || 1, m = Math.min(3.5, d / 40);
  eyes.querySelectorAll('.be-pupil').forEach(p=> p.setAttribute('transform', `translate(${(dx/d*m).toFixed(2)} ${(dy/d*m*0.6).toFixed(2)})`));
}, {passive:true});
document.addEventListener('keydown', e=>{
  if ($('#game').hidden || !game) return;
  if (!$('#sheet').hidden) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (game.phase === 'intro'){
    if (key === 'Escape' || key === ' ' || key === 'Enter'){ e.preventDefault(); if (game.skipIntro) game.skipIntro(); }
    return;
  }
  if (radial){ if (key === 'Escape'){ e.preventDefault(); closeRadial(); } return; }
  if (key === 'Escape'){ e.preventDefault(); closeGame(); return; }
  if (game.phase === 'boss'){
    const ae = document.activeElement;
    if ((key === ' ' || key === 'Enter') && !(ae && ae.tagName === 'BUTTON')){
      e.preventDefault(); if (e.repeat) return;
      const c = $('#topCard'), r = c && c.getBoundingClientRect();
      bossHit(1, r ? r.left + r.width/2 : null, r ? r.top + r.height/3 : null);
    }
    return;
  }
  if (game.phase !== 'play') return;
  const map = {ArrowLeft:'L', ArrowUp:'U', ArrowRight:'R', ArrowDown:'D', q:'UL', e:'UR', z:'DL', c:'DR'};
  if (map[key]){
    e.preventDefault();
    const t = targetFor(map[key]);
    if (t) act(t, map[key]); else nudge($('#deck'));
    return;
  }
  if (/^[1-6]$/.test(key) && +key <= state.count){ e.preventDefault(); act({type:'person', p:+key-1}); return; }
  if (key === '0' || key === 'a'){ e.preventDefault(); act({type:'all'}); return; }
  if (key === 's'){ e.preventDefault(); openSplit(); return; }
  if (key === 'k'){ e.preventDefault(); act({type:'skip'}); return; }
  if (key === 'u' || key === 'Backspace'){ e.preventDefault(); undo(); return; }
  if ((key === 'Enter' || key === 'r') && document.activeElement && (document.activeElement.id === 'topCard' || key === 'r')){
    e.preventDefault();
    const c = $('#topCard'); if (!c) return;
    const r = c.getBoundingClientRect(); openRadial(r.left + r.width/2, r.top + r.height/2, true);
  }
});

/* ---- self-test viewer (#selftest) ---- */
function showSelfTest(){
  const {res, failed} = selfTest();
  const box = document.createElement('section');
  box.className = 'panel';
  box.innerHTML = `<h2 class="sub">Self-test: ${failed.length ? failed.length+' failed' : 'all '+res.length+' passed'}</h2>
    <div class="selftest">${res.map(r=>`${r.pass?'✓':'✗'} ${esc(r.name)}${r.pass?'':'  → got '+esc(JSON.stringify(r.detail))}`).join('\n')}</div>`;
  screenEl.prepend(box);
}

/* ---- boot ---- */
applyMotion();
render();
setTimeout(()=>{ try { selfTest(); } catch(e){ console.error('self-test crashed', e); } }, 0);
</script>
